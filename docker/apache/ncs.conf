<VirtualHost *:80>
    ServerName ncsintranet.atenimedia.com
    DocumentRoot /var/www/html

    # TLS terminates at the Caddy proxy; trust its forwarded client IP and scheme.
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Never serve application internals, regardless of .htaccess files.
    <DirectoryMatch "^/var/www/html/(app|system|writable|install|Docs|updates|scripts|tests|docker)(/|$)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "(?i)(^\.|\.(env|sql|md|py|log|ps1|sh|yml|yaml|lock|csv|ini|bak)$|^(Dockerfile|Caddyfile|composer\.json|spark)$)">
        Require all denied
    </FilesMatch>

    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/png "access plus 7 days"
        ExpiresByType image/jpeg "access plus 7 days"
        ExpiresByType image/svg+xml "access plus 7 days"
        ExpiresByType font/woff2 "access plus 30 days"
        ExpiresByType text/css "access plus 1 day"
        ExpiresByType application/javascript "access plus 1 day"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
